name: Boletín diario

on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boletin
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recolectar
        run: python scripts/recolectar.py
      - name: Traducir y redactar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/traducir.py
      - name: Construir datos.json
        run: python scripts/construir.py
      - name: Publicar
        run: |
          git config user.name  "boletin"
          git config user.email "actions@users.noreply.github.com"
          git add web/datos.json datos/cache_traduccion.json
          git diff --staged --quiet && echo "sin cambios" && exit 0
          git commit -m "Boletín $(date -u +%Y-%m-%d)"
          git push
