name: Boletín diario

on:
  schedule:
    # 05:10 UTC = 07:10 en España (verano) / 06:10 (invierno).
    - cron: "10 5 * * *"
  workflow_dispatch:
    inputs:
      rapido:
        description: "Topes altos (para ponerse al día los primeros días)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: boletin
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recolectar
        run: |
          if [ "${{ inputs.rapido }}" = "true" ]; then
            python scripts/recolectar.py --rapido
          else
            python scripts/recolectar.py
          fi
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Traducir y redactar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX_CRONICAS: ${{ inputs.rapido && '30' || '10' }}
        run: python scripts/traducir.py

      - name: Construir la web
        run: python scripts/construir.py

      - name: Publicar
        run: |
          git config user.name  "boletin"
          git config user.email "actions@users.noreply.github.com"
          git add web/datos.json web/archivo.json web/mis-carreras.ics datos/cache_traduccion.json
          git diff --staged --quiet && echo "sin cambios" && exit 0
          git commit -m "Boletín $(date -u +%Y-%m-%d)"
          git push
